# =============================================================================
# services/cdc — Postgres + Kafka Connect (Debezium) — Phase 4, opt-in
# =============================================================================
# Opt-in via profile: cdc. Started by `make cdc-up`.
# Postgres runs in logical-replication mode (pgoutput plugin). Debezium is
# registered dynamically via the Connect REST API on :8083.
# Ephemeral (no volume) — recreate gives a clean source; notebooks seed data.
# =============================================================================

services:

  # ── Postgres (CDC source) ─────────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: postgres
    profiles: ["cdc"]
    mem_limit: ${POSTGRES_MEM_LIMIT:-512m}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-cdc}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-cdc}
      - POSTGRES_DB=${POSTGRES_DB:-inventory}
    # Logical decoding settings Debezium requires (pgoutput plugin built into PG 16).
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=4"
      - "-c"
      - "max_replication_slots=4"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cdc} -d ${POSTGRES_DB:-inventory}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ── Kafka Connect + Debezium Postgres connector ───────────────────────────
  kafka-connect:
    image: debezium/connect:3.0.0.Final
    container_name: kafka-connect
    profiles: ["cdc"]
    mem_limit: ${CONNECT_MEM_LIMIT:-1g}
    ports:
      - "${CONNECT_PORT:-8083}:8083"
    environment:
      - BOOTSTRAP_SERVERS=kafka:9092
      - GROUP_ID=lakehouse-lab-connect
      - CONFIG_STORAGE_TOPIC=connect_configs
      - OFFSET_STORAGE_TOPIC=connect_offsets
      - STATUS_STORAGE_TOPIC=connect_statuses
      # RF=1 on Connect internal topics — single-broker dev cluster.
      - CONFIG_STORAGE_REPLICATION_FACTOR=1
      - OFFSET_STORAGE_REPLICATION_FACTOR=1
      - STATUS_STORAGE_REPLICATION_FACTOR=1
      - KEY_CONVERTER=org.apache.kafka.connect.json.JsonConverter
      - VALUE_CONVERTER=org.apache.kafka.connect.json.JsonConverter
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    restart: unless-stopped
