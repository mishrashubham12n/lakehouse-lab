# =============================================================================
# Spark Defaults — Iceberg + Delta + Hudi on S3 (MiniStack)
# Used by Spark Connect Server (Docker) and local Spark (fallback)
# =============================================================================

# ── SQL Extensions ───────────────────────────────────────────────────────────
# Order: Iceberg → Nessie → Hudi → Delta. Iceberg first lets its parser handle
# catalog DDL (CREATE NAMESPACE, MERGE INTO iceberg tables) before others see
# it. Nessie next adds CREATE/DROP BRANCH, USE REFERENCE, MERGE BRANCH DDL
# scoped to `nessie_catalog` — used by CAT-3 (Git-like branching). Hudi/Delta
# last: HoodieSparkSessionExtension's parser hooks intercept some analyzer
# passes and blow up on Iceberg catalog DDL if listed first. Hudi tables still
# work via `USING hudi` clause + spark_catalog+LOCATION (LAK-11/12 pattern).
# JARs are pre-installed in $SPARK_HOME/jars/ via Dockerfile multi-stage build.
spark.sql.extensions                    org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions,\
                                        org.projectnessie.spark.extensions.NessieSparkSessionExtensions,\
                                        org.apache.spark.sql.hudi.HoodieSparkSessionExtension,\
                                        io.delta.sql.DeltaSparkSessionExtension

# ── Serializer ───────────────────────────────────────────────────────────────
# Kryo is required by Hudi and is the recommended serializer for Iceberg/Delta.
spark.serializer                        org.apache.spark.serializer.KryoSerializer

# ── Catalogs — all warehouses on s3a:// against MiniStack ───────────────────

# Iceberg on Hadoop catalog (anti-pattern demo — filesystem semantics on S3)
spark.sql.catalog.iceberg_catalog                   org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg_catalog.type              hadoop
spark.sql.catalog.iceberg_catalog.warehouse         s3a://warehouse/iceberg/

# Iceberg on AWS Glue Data Catalog (real catalog — via MiniStack's Glue emulation).
# Glue holds the table pointer; S3FileIO (from iceberg-aws-bundle) does the data I/O.
# Endpoints target the `ministack` container (Docker path); the Iceberg AWS SDK v2
# does NOT read the s3a keys below, so signing creds come from the SDK default chain
# (-Daws.accessKeyId/secretAccessKey in spark.driver.extraJavaOptions). STATIC creds
# only — deliberately NO client.assume-role.arn (that would call STS, which MiniStack
# Community can't subscope). Local (non-Docker) Spark can't reach `ministack` — use
# this catalog over Spark Connect / Docker.
spark.sql.catalog.glue_catalog                      org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.glue_catalog.catalog-impl         org.apache.iceberg.aws.glue.GlueCatalog
spark.sql.catalog.glue_catalog.warehouse            s3a://warehouse/glue/
spark.sql.catalog.glue_catalog.io-impl              org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.glue_catalog.s3.endpoint          http://ministack:4566
spark.sql.catalog.glue_catalog.s3.path-style-access true
spark.sql.catalog.glue_catalog.glue.endpoint        http://ministack:4566
spark.sql.catalog.glue_catalog.client.region        us-east-1

# Delta on Spark's default catalog
spark.sql.catalog.spark_catalog                     org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.sql.catalog.spark_catalog.warehouse           s3a://warehouse/delta/

# Hudi tables — no dedicated `hudi_catalog` entry.
#
# HoodieCatalog extends Spark's DelegatingCatalogExtension, which is only
# valid when it REPLACES spark_catalog (needs a session-catalog delegate).
# Registering it as a standalone secondary catalog fails with
# `NullPointerException: this.delegate is null` on any DDL against it.
#
# Recommended pattern (used by LAK-11 / LAK-12 / dbt hudi models):
#     CREATE TABLE spark_catalog.<ns>.<name> (...) USING hudi
#     LOCATION 's3a://warehouse/hudi/<ns>/<name>/'
#     TBLPROPERTIES ('primaryKey'='...', 'preCombineField'='...', 'type'='cow');
# DeltaCatalog owns spark_catalog but delegates to Hudi's write path on
# `USING hudi` — this is the pattern most real Hudi deployments use.

# Nessie — Git-like branching for Iceberg tables (opt-in via `catalogs` profile).
# We deliberately use `NessieCatalog` (Nessie's *native* /api/v2 protocol) rather
# than `type=rest` (/iceberg/). Reason: the Nessie Spark SQL extension
# (`NessieSparkSessionExtensions`) — which provides `CREATE BRANCH`,
# `USE REFERENCE`, `MERGE BRANCH` DDL used by CAT-3 — is designed against the
# native catalog; against the Iceberg-REST adapter it mis-encodes the branch
# prefix as `<ref><warehouse>` (missing the `|` separator) and writes fail.
# Nimtable still browses Nessie via its /iceberg/ REST endpoint independently;
# both protocols read/write the SAME Nessie commit graph.
spark.sql.catalog.nessie_catalog                    org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.nessie_catalog.catalog-impl       org.apache.iceberg.nessie.NessieCatalog
spark.sql.catalog.nessie_catalog.uri                http://nessie:19120/api/v2
spark.sql.catalog.nessie_catalog.client-api-version 2
spark.sql.catalog.nessie_catalog.ref                main
spark.sql.catalog.nessie_catalog.warehouse          s3a://warehouse/nessie/
spark.sql.catalog.nessie_catalog.io-impl            org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.nessie_catalog.s3.endpoint        http://ministack:4566
spark.sql.catalog.nessie_catalog.s3.path-style-access true

# Polaris — Iceberg REST + RBAC (opt-in via `catalogs` profile)
spark.sql.catalog.polaris_catalog                   org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.polaris_catalog.type              rest
spark.sql.catalog.polaris_catalog.uri               http://localhost:8181/api/catalog
spark.sql.catalog.polaris_catalog.warehouse         lab
spark.sql.catalog.polaris_catalog.credential        root:secret
spark.sql.catalog.polaris_catalog.scope             PRINCIPAL_ROLE:ALL
# Pin the S3 data-I/O client to MiniStack (path-style). Without this the client
# built after Polaris' AssumeRole defaults to a real-AWS virtual-host hostname
# (bucket.s3.amazonaws.com) → UnknownHostException. Endpoint = `ministack` container.
spark.sql.catalog.polaris_catalog.io-impl                org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.polaris_catalog.s3.endpoint            http://ministack:4566
spark.sql.catalog.polaris_catalog.s3.path-style-access   true

# Default catalog stays spark_catalog (Hive/Delta) — Thrift + dbt need Hive-style default.
spark.sql.defaultCatalog                            spark_catalog

# ── s3a → MiniStack ─────────────────────────────────────────────────────────
# NOTE: The Docker entrypoint re-overrides `endpoint` to `http://ministack:4566`
# (container DNS). This localhost value is the fallback for LOCAL (non-Docker) Spark.
spark.hadoop.fs.s3a.endpoint                        http://localhost:4566
spark.hadoop.fs.s3a.access.key                      test
spark.hadoop.fs.s3a.secret.key                      test
spark.hadoop.fs.s3a.path.style.access               true
spark.hadoop.fs.s3a.connection.ssl.enabled          false
spark.hadoop.fs.s3a.aws.credentials.provider        org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

# ── Local write locations — everything under .tmp/ (gitignored) ────────────
# All table DATA lives on s3a://, but Spark's DeltaCatalog/HiveCatalog still
# needs Derby for namespace/table metadata, and the default `spark-warehouse`
# fallback dir is used by any statement that bypasses an explicit catalog
# (e.g. `CREATE TEMP TABLE ...`). Redirecting both keeps repo root clean.
# AWS SDK v2 credentials + region for the Iceberg AWS clients (GlueCatalog,
# S3FileIO, STS). These are read by the SDK default-credential/region chains as
# JVM system properties — the iceberg-aws-bundle SDK ignores the fs.s3a.* keys.
# MiniStack accepts any creds; values match the s3a `test`/`test` pair.
spark.driver.extraJavaOptions           -Dderby.system.home=./.tmp/derby -Daws.accessKeyId=test -Daws.secretAccessKey=test -Daws.region=us-east-1
spark.sql.warehouse.dir                 ./.tmp/spark-warehouse

# ── Memory & Resources ──────────────────────────────────────────────────────
# Baseline driver heap. Docker entrypoint overrides this per profile from
# conf/profiles/*.env (SPARK_DRIVER_MEMORY) via compose `--env-file`.
spark.driver.memory                     2g
spark.driver.maxResultSize              1g
spark.sql.shuffle.partitions            20

# ── Network ──────────────────────────────────────────────────────────────────
spark.driver.bindAddress                0.0.0.0
spark.driver.host                       0.0.0.0

# ── Spark Connect (embedded via plugin in Thrift Server) ────────────────────
spark.plugins                           org.apache.spark.sql.connect.SparkConnectPlugin
spark.connect.grpc.binding.port         15002

# ── Spark Thrift Server (HiveServer2) ───────────────────────────────────────
spark.hive.server2.thrift.port          10000
spark.hive.server2.thrift.bind.host     0.0.0.0

# ── Spark UI ─────────────────────────────────────────────────────────────────
spark.ui.port                           4040

# ── Metrics → Prometheus (CAP-3 observability, optional) ─────────────────────
spark.ui.prometheus.enabled             true
spark.metrics.conf                      /app/conf/metrics.properties

# ── Developer Experience ─────────────────────────────────────────────────────
spark.sql.session.timeZone              UTC
spark.ui.showConsoleProgress            true
spark.sql.repl.eagerEval.enabled        true

# ── Event Log (for History Server) — kept LOCAL under .tmp/spark-events ─────
spark.eventLog.enabled                  true
spark.eventLog.dir                      ./.tmp/spark-events
spark.history.fs.logDirectory           ./.tmp/spark-events

# ── Optimizations ────────────────────────────────────────────────────────────
spark.sql.adaptive.enabled              true
